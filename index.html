const { useState, useEffect, useRef } = React;

/* ---------- hooks ---------- */
function useHashRoute(){
  const read = () => (location.hash || "#home").slice(1) || "home";
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const on = () => { setRoute(read()); window.scrollTo(0, 0); };
    addEventListener("hashchange", on); return () => removeEventListener("hashchange", on);
  }, []);
  return route;
}
function useTyping(text, speed = 38){
  const [out, setOut] = useState("");
  useEffect(() => {
    let i = 0, t;
    const step = () => { setOut(text.slice(0, i)); if (i++ < text.length) t = setTimeout(step, speed); };
    step(); return () => clearTimeout(t);
  }, [text]);
  return out;
}

function useNameCycle(names){
  // Types a name, holds it, erases it, then moves to the next one. Loops forever.
  const [out, setOut] = useState("");
  useEffect(() => {
    let idx = 0, len = 0, deleting = false, t;
    const tick = () => {
      const name = names[idx];
      if (!deleting){
        len++; setOut(name.slice(0, len));
        if (len === name.length){ deleting = true; t = setTimeout(tick, 1400); return; }
        t = setTimeout(tick, 85);
      } else {
        len--; setOut(name.slice(0, len));
        if (len === 0){ deleting = false; idx = (idx + 1) % names.length; t = setTimeout(tick, 350); return; }
        t = setTimeout(tick, 40);
      }
    };
    t = setTimeout(tick, 600);
    return () => clearTimeout(t);
  }, []);
  return out;
}

function Reveal({ children, className = "", delay = 0 }){
  const ref = useRef(null); const [shown, setShown] = useState(false);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting){ setShown(true); io.disconnect(); } }, { threshold: 0.12 });
    io.observe(ref.current); return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ transitionDelay: `${delay}ms` }}
      className={`transition duration-[550ms] ease-out ${shown ? "translate-y-0 opacity-100" : "translate-y-3 opacity-0"} ${className}`}>
      {children}
    </div>
  );
}

          <h1 className="text-[34px] font-bold leading-[1.08] tracking-tight text-white sm:text-[44px] lg:text-[52px] xl:text-[58px]">{CONTENT.heroTitle}</h1>
          <div className="mt-7 h-[3px] w-16 rounded-full bg-coral" />
          <p className="caret mt-8 min-h-[1.3em] text-[24px] font-semibold tracking-tight text-white sm:text-[30px]">{name}</p>
        </div>
      </div>
    </section>
  );
}

function Problem(){
  return (
    <Page>
      <PageHeader eyebrow="Problem Statement" title="Two signals, and a blind spot between them." />
      <div className="mt-7 max-w-3xl space-y-6 text-[16.5px] leading-[1.75] text-sub">
        <Reveal><p>Every diner in New York judges a restaurant twice. Once at the door, where the Department of Health posts a <b className="font-semibold text-ink">letter grade</b>. Once on a phone, where <b className="font-semibold text-ink">Yelp shows a star rating</b>. Both look like an answer. Neither is the whole record.</p></Reveal>
        <Reveal><p>The letter is the end of a long process — inspection, score, re-inspection, letter. The stars are the end of a different one: a diner’s evening, compressed into one to five. Different people produce them, for different reasons, in different places.</p></Reveal>
        <Reveal><p>Between them sits a blind spot. The <b className="font-semibold text-ink">DOHMH record is precise but buried</b>. Yelp is <b className="font-semibold text-ink">read by millions but was never built to carry public health information</b>: the health score sits under Amenities, an old grade can lead the page, and nothing tells a diner that anything changed.</p></Reveal>
      </div>
      <Reveal className="mt-14 max-w-3xl">
        <blockquote className="m-0 rounded-2xl border-l-4 border-coral bg-band p-7 sm:p-9">
          <p className="text-[19px] font-semibold leading-snug sm:text-[23px]">A diner is left with two numbers that feel authoritative. Neither was built to answer the question they are asking: is this kitchen safe?</p>
        </blockquote>
      </Reveal>
      <div className="mt-12 flex flex-wrap gap-3"><Pill href="#overview" primary>Overview</Pill><Pill href="#dash-1">Start with Dashboard 01</Pill></div>
    </Page>
  );
}

function Overview(){
  const probs = [
    ["The grade can be out of date", "The letter can come from an earlier inspection while a newer one is still unresolved."],
    ["The stars don’t track hygiene", "Ratings describe food, price and service. Reviewers never see the kitchen."],
    ["The record is buried", "Online, the health score sits under Amenities, in legal wording, and is missing from search."]
  ];
  return (
    <Page>
      <PageHeader eyebrow="Overview" title="Diners can’t tell if a kitchen is safe at the moment they choose." />
      <p className="mt-6 max-w-3xl text-[16.5px] leading-[1.75] text-sub">New York inspects every restaurant and publishes the results. But the two signals a diner sees — <b className="font-semibold text-ink">the letter on the door</b> and <b className="font-semibold text-ink">the stars on Yelp</b> — don’t reliably reflect what inspectors found. The record exists. It doesn’t reach the diner in a form they can use.</p>
      <div className="mt-10 grid gap-5 md:grid-cols-3">
        {probs.map(([t, d], i) => (
          <Reveal key={t} delay={i * 80}>
            <div className={`h-full rounded-2xl border border-line bg-white p-6 ${cardHover}`}>
              <span className="font-mono text-[11px] text-coral">{pad(i + 1)}</span>
              <h3 className="mt-3 text-[18px] font-bold leading-snug">{t}</h3>
              <p className="mt-2 text-[15px] leading-[1.75] text-sub">{d}</p>
            </div>
          </Reveal>
        ))}
      </div>
      <Reveal className="mt-6">
        <div className="rounded-2xl border-l-4 border-coral bg-band p-7 sm:p-9">
          <Eyebrow>The question we ask</Eyebrow>
          <p className="mt-3 text-[19px] font-semibold leading-snug sm:text-[22px]">Can a diner judge a restaurant’s food safety from what they see today — and if not, how should it be shown?</p>
        </div>
      </Reveal>
      <Reveal className="mt-16">
        <section className="rounded-2xl bg-band px-6 py-10 sm:px-10">
          <SectionHeading>Who does it matter to?</SectionHeading>
          <p className="mt-5 max-w-2xl text-[16px] leading-[1.75] text-sub">Four groups have something at stake in how New York shows inspection results.</p>
          <StakeholderGrid />
        </section>
      </Reveal>
    </Page>
  );
}

function Dashboard({ d }){
  const i = CONTENT.dashboards.indexOf(d);
  const prev = CONTENT.dashboards[i - 1], next = CONTENT.dashboards[i + 1];
  const Nav = ({ href, label, title, right }) => (
    <a href={href} className={`flex flex-col rounded-2xl border border-line bg-white p-5 ${cardHover} ${right ? "sm:items-end sm:text-right" : ""}`}>
      <span className="text-[10px] font-semibold uppercase tracking-[0.2em] text-sub">{label}</span>
      <span className="mt-1.5 text-[15px] font-semibold">{title}</span>
    </a>
  );
  return (
    <Page>
      <PageHeader eyebrow={`${pad(d.n)} · ${d.owner}`} title={d.title} />
      <p className="mt-7 max-w-3xl text-[16.5px] leading-[1.75] text-sub">{d.intro}</p>
      <p className="mt-5 text-[11px] font-semibold uppercase tracking-[0.16em] text-sub">Source: {d.source}</p>
      <Reveal className="mt-8"><TableauFrame n={d.n} question={d.question} views={d.views} source={d.source} /></Reveal>
      <Reveal className="mt-16">
        <SectionHeading>Insights</SectionHeading>
        <InsightsAccordion items={d.insights} />
      </Reveal>
      <Reveal className="mt-12">
        <div className="rounded-2xl border-l-4 border-coral bg-band p-7 sm:p-8">
          <Eyebrow>Takeaway</Eyebrow>
          <p className="mt-3 text-[18px] font-semibold leading-snug sm:text-[20px]">{d.takeaway}</p>
        </div>
      </Reveal>
      <div className="mt-12 grid gap-4 sm:grid-cols-2">
        {prev ? <Nav href={`#dash-${prev.n}`} label="Previous" title={`${pad(prev.n)} · ${prev.nav}`} /> : <Nav href="#overview" label="Previous" title="Overview" />}
        {next ? <Nav right href={`#dash-${next.n}`} label="Next" title={`${pad(next.n)} · ${next.nav}`} /> : <Nav right href="#redesign" label="Next" title="Redesign Proposal" />}
      </div>
    </Page>
  );
}

function Redesign(){
  const wrong = [
    ["The health score sits under Amenities.", "A public health fact filed next to parking and Wi-Fi."],
    ["The page can lead with an old grade.", "The first thing a diner reads may come from an earlier cycle."],
    ["It uses regulatory wording.", "Findings are written for enforcement, not for reading."]
  ];
  const Stars = () => <span className="tracking-[2px] text-coral">★★★★½</span>;
  const Label = ({ children, coral }) => <p className={`text-[10px] font-semibold uppercase tracking-[0.2em] ${coral ? "text-coral" : "text-sub"}`}>{children}</p>;
  return (
    <Page>
      <PageHeader eyebrow="Redesign Proposal" title="Show the record where diners are already looking." />
      <p className="mt-7 max-w-3xl text-[16.5px] leading-[1.75] text-sub">After a citation, ratings move about 0.02 and related complaints don’t rise. Nothing in the stars or reviews warns a diner. So the listing itself has to carry the inspection result — clearly, and without labelling any restaurant unsafe.</p>

      <Reveal className="mt-14">
        <section className="rounded-2xl bg-band px-6 py-10 sm:px-10">
          <SectionHeading>What is wrong today</SectionHeading>
          <div className="mt-7 grid gap-7 md:grid-cols-3">
            {wrong.map(([t, d]) => <div key={t}><h3 className="text-[16px] font-bold leading-snug">{t}</h3><p className="mt-2 text-[15px] leading-[1.75] text-sub">{d}</p></div>)}
          </div>
        </section>
      </Reveal>

      <Reveal className="mt-16">
        <SectionHeading>Before and after</SectionHeading>
        <p className="mt-5 text-[16px] leading-[1.75] text-sub">Same restaurant, same day, same public data.</p>
      </Reveal>
      <div className="mt-7 grid items-start gap-5 lg:grid-cols-2">
        <Reveal>
          <div className={`rounded-2xl border border-line bg-white p-7 ${cardHover}`}>
            <Label>Today</Label>
            <h3 className="mt-4 text-[20px] font-bold">Casa Verdiana</h3>
            <div className="mt-2 flex items-center gap-3 text-[14px] text-sub"><Stars />1,204 reviews</div>
            <p className="mt-1 text-[14px] text-sub">$$ · Italian · East Village</p>
            <div className="mt-5 border-t border-line pt-5 text-[14px] text-sub">
              <p className="font-semibold text-ink">Amenities</p>
              <p className="mt-1">Takeout · Delivery · Wi-Fi · Outdoor seating</p>
              <p className="mt-3 font-mono text-[11.5px]">Health score 12 · Grade A · Inspected 2023-05-14</p>
              <p className="mt-1 text-[13px] italic">[One long regulatory sentence per violation]</p>
            </div>
          </div>
        </Reveal>
        <Reveal delay={100}>
          <div className={`rounded-2xl border border-coral/40 bg-white p-7 ${cardHover}`}>
            <Label coral>Proposed</Label>
            <h3 className="mt-4 text-[20px] font-bold">Casa Verdiana</h3>
            <div className="mt-2 flex flex-wrap items-center gap-3 text-[14px] text-sub">
              <Stars /><span className="font-mono text-[14px] font-medium text-ink">4.5</span>
              <span className="grid h-8 w-8 place-items-center rounded-full bg-coral text-[15px] font-bold text-white">A</span>
              <span>Inspected <span className="font-mono text-[12.5px]">08 Aug 2026</span></span>
            </div>
            <p className="mt-1 text-[14px] text-sub">1,204 reviews · $$ · Italian · East Village</p>
            <div className="mt-5 flex gap-3 rounded-xl bg-band p-4 text-[14px] text-sub">
              <span className="mt-0.5 text-coral"><Icon d={I.alert} className="h-4 w-4" /></span>
              <p><b className="font-semibold text-ink">Grade pending.</b> A newer inspection on <span className="font-mono text-[12.5px]">12 Oct 2026</span> is unresolved.</p>
            </div>
            <div className="mt-5">
              <Label>Latest findings</Label>
              <div className="mt-2 divide-y divide-line text-[14px]">
                <div className="flex items-center gap-3 py-2.5"><span className="w-[62px] shrink-0 rounded-full bg-coral py-0.5 text-center text-[10.5px] font-semibold uppercase tracking-wide text-white">Serious</span>Cold food stored too warm</div>
                <div className="flex items-center gap-3 py-2.5"><span className="w-[62px] shrink-0 rounded-full border border-line py-0.5 text-center text-[10.5px] font-semibold uppercase tracking-wide text-sub">Minor</span>Food-contact surface not clean</div>
              </div>
            </div>
            <div className="mt-5 text-[13.5px]">
              <p className="text-ink">Findings vs. similar Italian restaurants nearby</p>
              <div className="relative mt-2 h-2 rounded-full bg-band">
                <span className="absolute inset-y-0 left-0 w-[38%] rounded-full bg-coral" />
                <span className="absolute -top-1 left-[46%] h-4 w-0.5 bg-ink" />
              </div>
              <p className="mt-1.5 font-mono text-[11px] text-sub">2 findings · median 3</p>
            </div>
          </div>
        </Reveal>
      </div>
      <p className="mt-3 font-mono text-[11px] text-sub">FIG. R1 — Illustrative mock-up. The restaurant is fictional.</p>

      <Reveal className="mt-16"><SectionHeading>The six changes</SectionHeading></Reveal>
      <div className="mt-7 grid gap-5 md:grid-cols-2">
        {CONTENT.changes.map((c, i) => (
          <Reveal key={c.t} delay={(i % 2) * 80}>
            <div className={`h-full rounded-2xl border border-line bg-white p-7 ${cardHover}`}>
              <span className="font-mono text-[11px] text-coral">{pad(i + 1)}</span>
              <h3 className="mt-3 text-[18px] font-bold leading-snug">{c.t}</h3>
              <p className="mt-2 text-[15px] leading-[1.75] text-sub">{c.d}</p>
              <div className="mt-6 border-t border-line pt-5">
                <Label>Design principle</Label>
                <p className="mt-2 text-[14.5px] font-semibold">{c.principle}</p>
                <p className="mt-1 text-[14px] leading-relaxed text-sub">{c.why}</p>
              </div>
            </div>
          </Reveal>
        ))}
      </div>
    </Page>
  );
}

/* ---------- app ---------- */
function App(){
  const route = useHashRoute();
  const [menu, setMenu] = useState(false);
  const dash = CONTENT.dashboards.find(d => route === `dash-${d.n}`);
  const page = route === "problem" ? <Problem /> : route === "overview" ? <Overview /> : route === "redesign" ? <Redesign /> : dash ? <Dashboard d={dash} /> : <Home />;
  const key = dash ? route : ["problem","overview","redesign"].includes(route) ? route : "home";
  return (
    <>
      <TopBar onMenu={() => setMenu(true)} />
      <Sidebar route={key} open={menu} onClose={() => setMenu(false)} />
      <main className="min-h-screen pt-14 lg:ml-[280px] lg:pt-0">
        <div key={key} className="route-in">{page}</div>
      </main>
      <BackToTop />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
